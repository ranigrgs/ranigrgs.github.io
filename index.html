<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rani Gerges Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* LEFT + RIGHT GREY BARS */
.side{
    position:fixed;
    top:0;
    width:80px;
    height:100vh;
    background:#2b2b2b;
}

.side.left{ left:0; }
.side.right{ right:0; }

/* MAIN CARD */
.card{
    background:black;
    color:white;
    width:900px;
    max-width:90%;
    padding:80px 60px;
    text-align:center;
}

/* NAME */
h1{
    font-size:52px;
    font-weight:700;
    margin-bottom:10px;
}

/* DEGREE */
h2{
    font-size:22px;
    font-weight:500;
    margin-bottom:40px;
    color:#ddd;
}

/* ROLE LINE */
.roles{
    font-size:18px;
    font-weight:500;
    margin-bottom:10px;
}

/* SERVICES LINE */
.services{
    font-size:14px;
    color:#bbb;
    letter-spacing:0.5px;
}

/* CONTACT */
.contact{
    margin-top:60px;
    font-size:16px;
    line-height:1.8;
    color:#fff;
}

.contact span{
    display:block;
}

</style>
</head>

<body>

<div class="side left"></div>
<div class="side right"></div>

<div class="card">

    <h1>Rani Gerges</h1>

    <h2>M. Sc. Architecture</h2>

    <div class="roles">
        Designer • Urban Researcher • Project Manager
    </div>

    <div class="services">
        Architecture | Urban Planning | Graphic Design | Event Planning
    </div>

    <div class="contact">
        <span>+49 151 53277995</span>
        <span>gergesrani@gmail.com</span>
    </div>

</div>

</body>
</html>
